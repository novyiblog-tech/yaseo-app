[project]
name = "yaseo-app"
version = "0.0.1"
description = "Веб-сервис на движке yaseo: кабинеты, отчёты, платные функции"
requires-python = ">=3.11"
dependencies = [
    "yaseo",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "fastapi>=0.142.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.32",
    "psycopg-pool>=3.3.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
finmodel = ["openpyxl>=3.1"]

[tool.uv.sources]
# Движок ставится пакетом на закреплённом теге. Правки движка идут в его репозиторий,
# сюда — только подъём тега.
yaseo = { git = "https://github.com/novyiblog-tech/yaseo", tag = "v0.1.4" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaseo_app"]
